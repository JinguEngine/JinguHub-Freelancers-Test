name: Sync Jingu freelancer labels
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: read
  issues: write
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Validate marker and synchronize labels
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.issue?.body || '';
            const match = body.match(/<!-- JINGU_FREELANCER_V1:([A-Za-z0-9_-]+) -->/);
            if (!match) return;
            let meta;
            try {
              meta = JSON.parse(Buffer.from(match[1], 'base64url').toString('utf8'));
            } catch { return; }
            const kinds = new Set(['recruiting', 'seeking']);
            const compensation = new Set(['paid', 'volunteer', 'negotiable']);
            const areas = new Set(['programming','art-2d','art-3d','game-design','ui-ux','animation','music','sound','qa','writing','production','marketing','community','other']);
            const https = value => value == null || value === '' || (typeof value === 'string' && value.length <= 2048 && value.startsWith('https://'));
            if (meta?.schema !== 1 || typeof meta.summary !== 'string' || meta.summary.length < 10 || meta.summary.length > 280 || !kinds.has(meta.kind) || !compensation.has(meta.compensation) || !Array.isArray(meta.areas) || meta.areas.length < 1 || meta.areas.length > 6 || meta.areas.some(v => !areas.has(v)) || !https(meta.portfolio_url) || !https(meta.contact_url) || !https(meta.image_url)) return;
            const managed = [`tipo:${meta.kind}`, `modalidade:${meta.compensation}`, ...meta.areas.map(v => `area:${v}`)];
            const existing = (context.payload.issue?.labels || []).map(label => typeof label === 'string' ? label : label.name).filter(Boolean);
            const preserved = existing.filter(label => !/^(tipo:|modalidade:|area:)/.test(label));
            const labels = [...preserved, ...managed];
            const definitions = {
              [`tipo:${meta.kind}`]: '7bc96f',
              [`modalidade:${meta.compensation}`]: 'd4c5f9',
            };
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({owner: context.repo.owner, repo: context.repo.repo, name: label});
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({owner: context.repo.owner, repo: context.repo.repo, name: label, color: definitions[label] || '6e7681'});
              }
            }
            await github.rest.issues.setLabels({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, labels});
